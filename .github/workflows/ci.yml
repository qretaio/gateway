name: build gateway image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: gateway-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # The node is x86_64 — a plain musl cross-build (no zig needed).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks scans the full history; a shallow clone would miss
          # a secret buried in an older commit.
          fetch-depth: 0

      - name: Secret scan (gitleaks CLI — no license needed)
        # The gitleaks ACTION requires a paid license for orgs; the open
        # source CLI does not. Install it directly and scan full history.
        run: |
          GITLEAKS_VERSION=8.30.1
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sudo tar xz -C /usr/local/bin gitleaks
          gitleaks version
          gitleaks --config .gitleaks.toml detect --no-banner

      - name: Install Rust (nightly — edition 2024 / current deps)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          targets: x86_64-unknown-linux-musl

      - name: Install musl toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq musl-tools

      - name: Build static musl binary
        env:
          CC_x86_64_unknown_linux_musl: x86_64-linux-musl-gcc
        run: cargo build --release --target x86_64-unknown-linux-musl --bin gateway

      - name: Stage binary for the image
        run: |
          mkdir -p build
          cp target/x86_64-unknown-linux-musl/release/gateway build/gateway

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: build/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/qretaio/gateway:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
