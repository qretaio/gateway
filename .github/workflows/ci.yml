name: build gateway image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: gateway-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (nightly — edition 2024 / current deps)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          targets: x86_64-unknown-linux-musl

      - name: Install zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.13.0

      - name: Install cargo-zigbuild
        run: cargo install cargo-zigbuild --locked

      - name: Build static musl binary
        run: cargo zigbuild --release --target x86_64-unknown-linux-musl --bin gateway

      - name: Stage binary for the image
        run: cp target/x86_64-unknown-linux-musl/release/gateway build/gateway

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: build
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/qretaio/gateway:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
