[workspace]
resolver = "3"
members = [
    "crates/gateway",
    "crates/gateway-core",
    "crates/graceful-handover",
]

[package]
name = "gateway-bin"
version = "0.1.0"
edition = "2024"
publish = false
description = "The standalone gateway binary: TLS, host routing, the edge cache, and request coalescing for the qreta fleet."

[[bin]]
name = "gateway"
path = "src/main.rs"

[dependencies]
gateway = { path = "crates/gateway" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }

[workspace.package]
version = "0.1.0"
edition = "2024"
