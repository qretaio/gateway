[workspace]
resolver = "3"
exclude = ["vendor/seatlock", "vendor/fsm"]
members = [
    "crates/gateway",
    "crates/gateway-core",
    "crates/graceful-handover",
    "crates/incident-log",
]

[package]
name = "gateway-bin"
version = "0.1.0"
edition = "2024"
publish = false
description = "The standalone gateway binary: TLS, host routing, the edge cache, and request coalescing for the qreta fleet."

[[bin]]
name = "gateway"
path = "src/main.rs"

[dependencies]
gateway = { path = "crates/gateway" }
incident-log = { path = "crates/incident-log" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "registry"] }
# kube's k8s-openapi needs a version feature chosen by the final binary.
k8s-openapi = { version = "0.29", features = ["v1_33"] }
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
