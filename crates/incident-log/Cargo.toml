[package]
name = "incident-log"
version = "0.1.0"
edition = "2024"
publish = false
description = "Structured security-incident logging for the edge gateway as a tracing layer: capture target=incident events, build org-audit LogRecords, and flush parquet segments to a pluggable sink (local dir or the node's private log-write face)."

[dependencies]
parquet-log = { git = "https://github.com/qretaio/parquet-log", tag = "v0.1.0" }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["registry"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
tokio = { version = "1", features = ["sync", "rt", "time", "macros", "fs"] }
futures = "0.3"

[lints.rust]
future_incompatible = { level = "deny", priority = -1 }
nonstandard_style = { level = "deny", priority = -1 }

[lints.clippy]
all = { level = "deny", priority = -2 }
