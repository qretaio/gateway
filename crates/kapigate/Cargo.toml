[package]
name = "kapigate"
version = "0.1.0"
edition = "2024"
publish = false
description = "The kapigate serving face: host routing, edge cache, coalesced forwards, and the optional CRI deploy arm."

[dependencies]
# The pure laws (route matcher, asset law + its AssetSpec, cache store,
# trim) — one home, THIS workspace.
kapigate-core = { path = "../kapigate-core" }
# The drain discipline: the trigger latches, stop-accept happens
# structurally before the barrier, the in-flight count is the receiver
# count.
graceful-handover = { path = "../graceful-handover" }
# Block/penalty sites emit `target: "incident"` structured tracing events.
tracing = "0.1"
# The serving face (the same stack the node serves with).
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json"] }
hyper = { version = "1", default-features = false, features = ["http1", "server", "full"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-util", "net", "time", "sync", "signal", "process"] }
# The kapi watch client and the node forwarder.
reqwest = { version = "0.12", default-features = false, features = ["stream", "json"] }
# Shared OCI pull + disk cache with both wisolate and kapigate (SWR).
qreta-oci = { path = "../../../oci" }
# The reuseport bind (kapi.spec EDGE-FR-010): the roll's overlap
# listens on the same port as its predecessor.
socket2 = { version = "0.5", features = ["all"] }
# The self-confinement (kapi.spec EDGE-FR-15): deny-by-default policies
# (Seatbelt/Landlock), applied restrict_self at boot. The CLI feature
# stays off — a library consumer never builds clap.
seatlock = { path = "../../vendor/seatlock", default-features = false }
# The artifact walk extracts the tree in memory; tar/gzip decode the
# layer; the reference/URL/digest-verify laws ride the oci module.
oci-spec = "0.10"
# The oci module's grammar (moved from gateway-oci 2026-11-16): sha2
# is the digest verify, wasmparser the unit wrapper's custom-section
# payload walk.
sha2 = "0.10"
wasmparser = "0.262"
tar = "0.4"
flate2 = "1"
base64 = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The live route index (owner directives 2026-11-16: "venndb as the live
# index built from the delta updates from the watch api" + "directly
# filter based on target url") — the bitset filter face over the route
# rows, queried by host + path-prefix predicate; the delta law stays the
# Table's.
venndb = "0.7"
# Forward-confirmed reverse DNS for verified-bot allowlisting: a safe,
# async stub resolver with PTR lookups, replacing hand-rolled getnameinfo
# FFI (which would need unsafe and cannot be portably bounded with a
# timeout). Only the system resolver config is used; no custom DNS.
hickory-resolver = { version = "0.26", default-features = false, features = ["tokio", "system-config"] }
# The compiled rate-limit selectors share the WAF's wirefilter engine; the
# gateway holds the compiled `Filter` behind an Arc across serving tasks.
wirefilter-engine = { git = "https://github.com/cloudflare/wirefilter.git", rev = "a101f7c0fc60012803ee23432b5514644d9fbe4f" }
anyhow = "1"
toml = { version = "1", default-features = false, features = ["std", "parse", "serde"] }
uniflight = "0.9.0"
bytes = "1"
# PoW challenge nonces: small, OS-seeded randomness (pure computation).
getrandom = "0.3"

[dev-dependencies]
tokio-stream = "0.1"

[lints.rust]
future_incompatible = { level = "deny", priority = -1 }
nonstandard_style = { level = "deny", priority = -1 }

[lints.clippy]
all = { level = "deny", priority = -2 }
