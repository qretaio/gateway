[package]
name = "gateway-core"
version = "0.1.0"
edition = "2024"
description = "The gateway layer pure laws: host route matcher, asset response law, edge cache store, inbound trim, WAF filter law, sliding-window rate-limit decision, verified-bot FCrDNS law. Zero I/O, forbid(unsafe)."

[dependencies]
# The AssetSpec a row's JSON parses into (serde derive on the type).
serde = { version = "1", features = ["derive"] }
# Proof-of-work challenge law: HMAC-signed challenges, SHA-256 work,
# constant-time tag comparison. Pure computation — no I/O.
sha2 = "0.10"
hmac = "0.12"
subtle = "2"
base64 = "0.23"
# The asset law builds http::Response values (the wire shape both the
# node's serving path and the future edge binary share).
http = "1"
# The cache's engine half (`CacheDispatch`) is the async face the WIT
# crossing implements; the store itself is std-only.
async-trait = "0.1"
# The WAF law's expression engine (cloudflare/wirefilter, MIT): Wireshark-
# like filters parsed/compiled/executed against a request snapshot. Crate
# name is `wirefilter-engine`; its library (and Rust API root) is `wirefilter`.
# PINNED TO UNRELEASED MASTER 0.7: this is the version whose compiled
# `Filter` is Send + Sync (0.6.1's Box<dyn Fn> is not), letting the gateway
# compile rules ONCE at boot and share them as Arc<Filter> across requests.
# Rev a101f7c0 (2026-11-16). Revisit when 0.7 lands on crates.io.
wirefilter-engine = { git = "https://github.com/cloudflare/wirefilter.git", rev = "a101f7c0fc60012803ee23432b5514644d9fbe4f" }
# The asset law's spec vocabulary is THIS crate's own narrow
# AssetSpec/`HeaderRule` (hashes feed the ETag, header_rules the
# `_headers` rules) — the manifest's full grammar never crosses.

# The crate's own posture (the workspace wall converges later; the
# moved code keeps its lint shape).
[dev-dependencies]
serde_json = "1"
# The WAF engine comparison bench (benches/waf_engines.rs): CEL as the
# alternative filter engine. Program + Context are Send + Sync, so the
# bench covers both compile-per-eval and precompiled execution.
cel-interpreter = "0.10"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "waf_engines"
harness = false

[lints.rust]
future_incompatible = { level = "deny", priority = -1 }
nonstandard_style = { level = "deny", priority = -1 }

[lints.clippy]
all = { level = "deny", priority = -2 }
